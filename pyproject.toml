[project]
name = "processassist"
version = "0.0.1"
description = "Evaluated AI agent for process engineering: data, documents and calculators."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.2",
    "pyarrow>=15",
    "pyreadr>=0.5",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.10",
    "pandas-stubs",
]

[project.scripts]
processassist-data = "processassist.data:main"
processassist-plots = "processassist.plots:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/processassist"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.uv]
constraint-dependencies = ["fonttools<4.69"]
